[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.9",
    "fastapi>=0.116.1",
    "immudb-py>=1.5.0",
    "psycopg[binary]>=3.2.9",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.0.0",
    "pyjwt[crypto]>=2.8.0",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.35.0",
    "jsonschema>=4.22.0",
    "python-multipart",
    "watchdog>=6.0.0",
    "google-api-python-client>=2.0.0",
    "requests>=2.30.0"
]

[project.optional-dependencies]
dev = [
    "ty>=0.0.1",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "types-requests>=2.30.0",
    "types-PyYAML>=6.0.0",
    "types-python-dateutil>=2.9.0",
    "types-setuptools>=68.0.0",
    "types-redis>=4.6.0",
    "types-ujson>=5.8.0",
    "boto3-stubs[essential]>=1.30.0",
    "types-jsonschema>=4.0.0",
    "sqlalchemy-stubs>=0.4",
    "types-pyOpenSSL>=23.0.0",
    "types-cffi>=1.16.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.setuptools]
packages = ["dpp_api"]
